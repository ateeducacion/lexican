# Fast path to the GitHub Pages demo: on every push to main, build ONE demo artifact, check it (types, bundle
# guard, essential E2E on a Pages-like static server) and deploy exactly that artifact. It does not wait for the full
# validation (ci.yml); production releases (release.yml) still require the full gate.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Runs are serialized and only the newest pending one is kept: an older commit never deploys after a newer one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    # Trusted code only: main of this repository (never forks or pull requests).
    if: github.ref == 'refs/heads/main' && github.repository == 'ateeducacion/lexican'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # origin/main, for the check below
          persist-credentials: false

      - name: Deploy only commits that are on main
        run: git merge-base --is-ancestor HEAD origin/main

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun ci
      - run: bun run check:lockfile
      - run: bun run typecheck
      - run: bun run build:demo
      - run: bun run check:dist

      # Essential journeys on the very artifact to deploy.
      - run: bunx --bun playwright install --with-deps chromium
      - run: bun run e2e --project=demo-chromium
        env:
          E2E_DEMO_PREBUILT: '1'

      # Error monitoring for the public demo only (never the production build): injected into the tested artifact,
      # after the E2E (which reject off-origin requests). The DSN is public by design. With the optional
      # SENTRY_AUTH_TOKEN secret, sourcemaps are uploaded to Sentry; they are never published.
      - name: Add Sentry error monitoring
        env:
          SENTRY_DSN: https://4304702c6bb29f96a2f244cf663bf69b@o4510456164712448.ingest.de.sentry.io/4512272277766225
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: erseco
          SENTRY_PROJECT: lexican
          SENTRY_URL: https://de.sentry.io/
          DIST: apps/web/dist-demo
        run: |
          REL="${GITHUB_SHA::12}"
          work="$RUNNER_TEMP/sentry"; mkdir -p "$work"
          printf '%s\n' \
            "import * as Sentry from '@sentry/browser';" \
            "Sentry.init({ dsn: '$SENTRY_DSN', release: '$REL', environment: 'production', sendDefaultPii: false, integrations: (d) => d.filter((i) => i.name !== 'BrowserSession') });" \
            > "$work/entry.js"
          (cd "$work" && npm i --no-save --no-audit --no-fund --silent @sentry/browser@11.4.0 esbuild@0.28.2 \
            && npx esbuild entry.js --bundle --minify --format=iife --outfile="$GITHUB_WORKSPACE/$DIST/sentry.js")
          # load before the app's own scripts, from every built page
          find "$DIST" -name '*.html' -print0 | while IFS= read -r -d '' f; do
            rel=$(realpath --relative-to="$(dirname "$f")" "$DIST/sentry.js")
            sed -i "0,/<head[^>]*>/s##&<script src=\"$rel\"></script>#" "$f"
            grep -q "<script src=\"$rel\"></script>" "$f"
          done
          if [ -n "$SENTRY_AUTH_TOKEN" ] && find "$DIST" -name '*.map' | grep -q .; then
            npx --yes @sentry/cli@3.8.0 sourcemaps inject "$DIST"
            npx --yes @sentry/cli@3.8.0 sourcemaps upload --release "$REL" "$DIST"
          fi
          find "$DIST" -name '*.map' -delete   # never publish sourcemaps

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist-demo

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-pages
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
