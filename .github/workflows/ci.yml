name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC, no secret token
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lexican
          POSTGRES_PASSWORD: lexican
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lexican" --health-interval 5s --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: legacy
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://lexican:lexican@localhost:5432/postgres
      TEST_MARIADB_URL: mysql://root:root@127.0.0.1:3306/legacy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun ci
      - run: bun run check:lockfile
      - run: bun run audit
      - run: bun run licenses
      - run: bun run lint # Biome: lint, formatting and import order
      - run: bun run typecheck
      # Unit, contract (PGlite AND PostgreSQL), API integration and MariaDB migration tests; fails under 90 %.
      - run: bun run test:coverage

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
      - run: bun run build
      - run: bun run build:demo
      - run: bun run check:dist

      - run: bunx --bun playwright install --with-deps chromium firefox
      # Demo against a Pages-like static server; production E2E on Bun + PostgreSQL.
      - run: bun run e2e --project=demo-chromium --project=demo-firefox --project=demo-mobile --project=prod-chromium
        env:
          E2E_DATABASE_URL: postgres://lexican:lexican@localhost:5432/postgres

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  webkit:
    # Disabled for now: WebKit runs take 17+ minutes on hosted runners and need a review (slow PGlite boot, timeouts).
    # To be reworked in a dedicated pull request; WebKit can still be run locally with `bun run e2e:webkit`.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun ci
      - run: bunx --bun playwright install --with-deps webkit
      - run: bun run e2e:webkit
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-webkit
          path: playwright-report/
          retention-days: 7

  docker:
    uses: ./.github/workflows/docker.yml

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, docker, migration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-image
          path: ${{ runner.temp }}
      - name: Publish tested main image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_IMAGE_ID: ${{ needs.docker.outputs.image-id }}
        run: |
          docker image load -i "$RUNNER_TEMP/lexican-image.tar.gz"
          test "$(docker image inspect lexican:local --format '{{.Id}}')" = "$EXPECTED_IMAGE_ID"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker image tag lexican:local "$image:main"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image:main"

  migration:
    # Legacy MariaDB fixture → migrator → PostgreSQL → assertions (§79).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lexican
          POSTGRES_PASSWORD: lexican
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lexican" --health-interval 5s --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: legacy
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://lexican:lexican@localhost:5432/postgres
      TEST_MARIADB_URL: mysql://root:root@127.0.0.1:3306/legacy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun ci
      - run: bun run test:migration
