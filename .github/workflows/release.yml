# For tags v*: same quality gate as CI, then a release with the production bundle (web + API) and an SBOM.
# Pages already deployed this commit from main, so the tag never redeploys the demo.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  docker:
    uses: ./.github/workflows/docker.yml

  release:
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # create the GitHub release
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lexican
          POSTGRES_PASSWORD: lexican
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lexican" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://lexican:lexican@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Tag matches package.json
        run: |
          version="v$(bun -p "require('./package.json').version")"
          [ "$version" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($version)"; exit 1; }

      - run: bun ci
      - run: bun run audit
      - run: bun run licenses
      - run: bun run lint # Biome: lint, formatting and import order
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run build:demo
      - run: bun run check:dist
      - run: bun run sbom

      - name: Package production bundle (no node_modules)
        run: |
          set -euo pipefail
          name="lexican-${GITHUB_REF_NAME#v}"
          mkdir -p "release/$name"
          cp -r apps/web/dist "release/$name/web"
          cp -r apps/api/dist "release/$name/api"  # self-contained Bun bundle: run with bun --no-env-file api/server.js
          (cd release && zip -qr "../${name}.zip" "$name")
          (cd apps/web/dist-demo && zip -qr "../../../${name}-demo.zip" .)
          echo "NAME=${name}" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ${{ env.NAME }}.zip
            ${{ env.NAME }}-demo.zip
            sbom.spdx.json
          generate_release_notes: true

  publish-image:
    needs: [release, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-image
          path: ${{ runner.temp }}
      - name: Publish tested version and latest images to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_IMAGE_ID: ${{ needs.docker.outputs.image-id }}
        run: |
          docker image load -i "$RUNNER_TEMP/lexican-image.tar.gz"
          test "$(docker image inspect lexican:local --format '{{.Id}}')" = "$EXPECTED_IMAGE_ID"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker image tag lexican:local "$image:$GITHUB_REF_NAME"
          docker image tag lexican:local "$image:latest"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image:$GITHUB_REF_NAME"
          docker push "$image:latest"
