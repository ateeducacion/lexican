# Fast path to the GitHub Pages demo: on every push to main, build ONE demo artifact, check it (types, bundle
# guard, essential E2E on a Pages-like static server) and deploy exactly that artifact. It does not wait for the full
# validation (ci.yml); production releases (release.yml) still require the full gate.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Runs are serialized and only the newest pending one is kept: an older commit never deploys after a newer one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    # Trusted code only: main of this repository (never forks or pull requests).
    if: github.ref == 'refs/heads/main' && github.repository == 'ateeducacion/lexican'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # origin/main, for the check below
          persist-credentials: false

      - name: Deploy only commits that are on main
        run: git merge-base --is-ancestor HEAD origin/main

      # Node runs the tooling (Vite, Vitest, Playwright); Bun installs and runs the scripts.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun ci
      - run: bun run check:lockfile
      - run: bun run typecheck
      - run: bun run build:demo
      - run: bun run check:dist

      # Essential journeys on the very artifact to deploy.
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e --project=demo-chromium
        env:
          E2E_DEMO_PREBUILT: '1'

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist-demo

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-pages
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
