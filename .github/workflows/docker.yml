# Build and test once; CI and releases publish this artifact without rebuilding it.
name: Docker

on:
  workflow_call:
    outputs:
      image-id:
        description: Content ID of the tested production image
        value: ${{ jobs.docker.outputs.image-id }}

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image-id: ${{ steps.build.outputs.image-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production image
        id: build
        run: |
          docker build -t lexican:local \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          echo "image-id=$(docker image inspect lexican:local --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
      - name: Unconfigured image refuses to start (APP_ENV defaults to production)
        run: |
          if docker run --rm -e DATABASE_URL=postgres://x -e PUBLIC_URL=https://lexican.example.test lexican:local; then
            echo "::error::the image started without institutional configuration"; exit 1
          fi
      - name: Local compose profile comes up healthy with the tested image
        env:
          EXPECTED_IMAGE_ID: ${{ steps.build.outputs.image-id }}
        run: |
          docker compose --profile app up -d --no-build
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && break; sleep 2; done
          curl -fsS http://localhost:3000/api/health
          test "$(curl -fsS http://localhost:3000/api/auth/providers)" = '{"cas":"test","password":true}'
          curl -fsS -o /dev/null http://localhost:3000/
          test "$(docker inspect "$(docker compose ps -q app)" --format '{{.Image}}')" = "$EXPECTED_IMAGE_ID"
      - name: Save tested image
        run: docker image save lexican:local | gzip > "$RUNNER_TEMP/lexican-image.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-image
          path: ${{ runner.temp }}/lexican-image.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - if: always()
        run: docker compose --profile app logs --no-color && docker compose --profile app down -v
