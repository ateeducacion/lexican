name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lexican
          POSTGRES_PASSWORD: lexican
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lexican" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://lexican:lexican@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run audit
      - run: npm run licenses
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Unit + persistence contract tests on PGlite AND PostgreSQL (TEST_DATABASE_URL) + API integration.
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run build:demo
      - run: npm run check:dist

      - run: npx playwright install --with-deps chromium firefox
      - run: npm run e2e -- --project=demo-chromium --project=demo-firefox --project=demo-mobile --project=prod-chromium
        env:
          E2E_DATABASE_URL: postgres://lexican:lexican@localhost:5432/postgres

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  webkit:
    # WebKit boots the in-browser PGlite slowly on hosted runners: its own job, one worker, longer timeouts.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run e2e:webkit
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-webkit
          path: playwright-report/
          retention-days: 7

  migration:
    # Legacy MariaDB fixture → migrator → PostgreSQL → assertions (§79).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lexican
          POSTGRES_PASSWORD: lexican
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lexican" --health-interval 5s --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: legacy
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://lexican:lexican@localhost:5432/postgres
      TEST_MARIADB_URL: mysql://root:root@127.0.0.1:3306/legacy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:migration
