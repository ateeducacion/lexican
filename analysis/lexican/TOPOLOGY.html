<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Defense-in-depth: the data island is built from untrusted source. Allow only
     inline script/style (the viewer is self-contained) and block network egress, so
     even a breakout cannot exfiltrate. The injector also escapes < > & in the data. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>System topology</title>
<style>
  :root {
    --bg: #1e1e1e; --panel: #252526; --panel-2: #2d2d2d;
    --text: #d4d4d4; --muted: #8a8a8a; --accent: #cc785c;
    --border: #3a3a3a; --blue: #5ba0e0; --green: #6bb85a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg);
    color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; cursor: grab; }
  #map.dragging { cursor: grabbing; }

  #hud { position: absolute; top: 12px; left: 12px; width: 280px;
    display: flex; flex-direction: column; gap: 8px; z-index: 2; }
  .panel { background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; }
  .panel h1 { font-size: 15px; color: var(--accent); margin-bottom: 2px; }
  .panel .sub { color: var(--muted); font-size: 12px; }
  #search { width: 100%; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text); font: inherit; outline: none; }
  #search:focus { border-color: var(--accent); }
  #results { max-height: 180px; overflow-y: auto; margin-top: 4px; }
  #results div { padding: 4px 6px; border-radius: 4px; cursor: pointer;
    font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #results div:hover { background: var(--panel-2); }
  #results .kind { color: var(--muted); font-size: 11px; margin-left: 6px; }

  .toggles label { display: flex; align-items: center; gap: 7px;
    font-size: 13px; padding: 2px 0; cursor: pointer; }
  .swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  #flows select { width: 100%; margin-top: 4px; padding: 5px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font: inherit; }

  #sidebar { position: absolute; top: 12px; right: 12px; bottom: 12px;
    width: 320px; overflow-y: auto; z-index: 2; display: none; }
  #sidebar.open { display: block; }
  #sidebar h2 { font-size: 16px; word-break: break-word; }
  #sidebar .meta { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
  #sidebar .desc { font-size: 13px; margin: 0 0 10px; }
  #sidebar .desc .cap { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
  #sidebar h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin: 12px 0 4px; }
  #sidebar .link { color: var(--blue); cursor: pointer; display: block;
    padding: 2px 0; font-size: 13px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  #sidebar .link:hover { color: var(--accent); }
  #sidebar ol { padding-left: 20px; } #sidebar ol li { margin: 6px 0; font-size: 13px; }
  #sidebar .closebtn { float: right; cursor: pointer; color: var(--muted);
    font-size: 18px; line-height: 1; } #sidebar .closebtn:hover { color: var(--text); }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 9px;
    font-size: 11px; border: 1px solid var(--border); color: var(--muted); margin-right: 4px; }
  .badge.entry { border-color: var(--accent); color: var(--accent); }

  #hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    color: var(--muted); font-size: 12px; z-index: 2; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; }
  #err { position: absolute; inset: 0; display: none; place-items: center; z-index: 9; }
</style>
</head>
<body>
<canvas id="map"></canvas>

<div id="hud">
  <div class="panel">
    <h1 id="title">System topology</h1>
    <div class="sub" id="stats"></div>
  </div>
  <div class="panel">
    <input id="search" type="search" placeholder="Search modules, stores, jobs…" autocomplete="off">
    <div id="results"></div>
  </div>
  <div class="panel toggles" id="toggles"></div>
  <div class="panel" id="flows" style="display:none">
    <div class="sub">Business flow walkthrough</div>
    <select id="flowSel"><option value="">— none —</option></select>
  </div>
  <details class="panel" id="obs" style="display:none">
    <summary style="cursor:pointer;color:var(--muted);font-size:12px">Architect observations</summary>
    <ul id="obsList" style="padding-left:18px;margin-top:6px;font-size:12.5px"></ul>
  </details>
</div>

<aside id="sidebar" class="panel"></aside>
<div id="hint">scroll to zoom · drag to pan · click a node · double-click to zoom in · Esc to reset</div>
<div id="err" class="panel"><p>No topology data found in this file.<br>
Re-run <code>/code-modernization:modernize-map</code> to regenerate it.</p></div>

entries that were never sent and soft-deletes entries whose env\u00edo is enviado. It refuses to delete publicado ones. It is called by ComentariosController, DicAulaController, DiccionarioPersonalController, EnviosController, PDFController and dpEnvios_helper. It calls dicAula_helper, dpDiccionarios_helper, dpEnvios_helper and global_helper. It reads CampoValor, DiccionarioPersonal, DiccionarioPersonalAcepcionTematica and NivelEstudio, and writes DiccionarioPersonalEntrada. Other functions are outside the excerpt."}, {"id": "dpMedios_helper", "name": "dpMedios_helper", "kind": "module", "language": "php", "loc": 481, "file": "legacy/lexican/app/Helpers/dpMedios_helper.php", "description": "dpMedios_helper manages the media files (imagen, audio, video) attached to an acepci\u00f3n in the student's diccionario personal. dpMedio_TratarMedio replaces any existing medio of the same tipo_medio, saves the uploaded file via dpMedio_SaveMedio, records a DiccionarioPersonalAcepcionMedio row, and creates image or video thumbnails; dpMedio_DeleteMedio deletes the database record. It calls create-thumbnail, global_helper and video_thumbnail, reads model:DiccionarioPersonalAcepcion, and writes model:DiccionarioPersonalAcepcionMedio and ds:ext:file-storage. Callers include DiccionarioPersonalController, dpEnvios_helper, envioAcepcion_helper, pdf_helper and views under layouts/partials/consulta/* and layouts/partials/dpAcepcion/*."}, {"id": "mstEntradaValor_helper", "name": "mstEntradaValor_helper", "kind": "module", "language": "php", "loc": 11, "file": "legacy/lexican/app/Helpers/mstEntradaValor_helper.php"}]}, {"id": "dom:aula", "name": "Diccionario de aula", "kind": "domain", "children": [{"id": "DicAulaController", "name": "DicAulaController", "kind": "module", "language": "php", "loc": 1497, "file": "legacy/lexican/app/Http/Controllers/DicAulaController.php", "description": "DicAulaController manages classroom dictionaries (diccionarios de aula) for authenticated users. Its index method shows teachers (esDocente) the creation form, and its create method validates the form and saves a new dictionary. routes/web and views such as diccionario/aula and diccionario/home dispatch to it. It calls dicAula_helper, dpEntradas_helper, dpEnvios_helper, global_helper and mail_helper, and renders views such as diccionario/crearDicAula. It reads models including AreaMateria, Pautas and Persona, and writes ComentarioEntrada, DicAula, DicAulaDestinarioAviso and EnvioEntrada."}, {"id": "Policies/DicAulaPolicy", "name": "DicAulaPolicy", "kind": "module", "language": "php", "loc": 126, "file": "legacy/lexican/app/Policies/DicAulaPolicy.php"}, {"id": "daMedios_helper", "name": "daMedios_helper", "kind": "module", "language": "php", "loc": 130, "file": "legacy/lexican/app/Helpers/daMedios_helper.php"}, {"id": "dicAula_helper", "name": "dicAula_helper", "kind": "module", "language": "php", "loc": 1901, "file": "legacy/lexican/app/Helpers/dicAula_helper.php", "description": "dicAula_helper is a 1901-line helper module that manages classroom dictionaries: createOrUpdateDicAula and daCreateOrUpdateDicAulaByPersonaId create or update a DicAula along with its fields, pautas and participants, and can import entries from another dictionary. It writes DicAula, DicAulaCampo, DicAulaPauta, DicAulaParticipante, DicAulaEntrada, EnvioEntrada, EnvioAcepcion and ComentarioEntrada. It reads CampoEntrada, Persona, UserPersona and User, and calls global_helper and mstEntradaValor_helper. Its callers include DicAulaController, EnviosController, ComentariosController, pdf_helper and several diccionario views. The excerpt shows only the creation path."}]}, {"id": "dom:envios", "name": "Env\u00edos", "kind": "domain", "children": [{"id": "EnvioAcepcionController", "name": "EnvioAcepcionController", "kind": "module", "language": "php", "loc": 190, "file": "legacy/lexican/app/Http/Controllers/EnvioAcepcionController.php", "description": "EnvioAcepcionController lets a user edit a submitted sense (acepci\u00f3n) of an entry in the classroom dictionary (diccionario de aula). It loads the sense, its entry and the value lists for the edit form, then validates and saves changes such as definition, examples, themes and media. It is dispatched from routes/web, view:diccionario/aula/acepcionEdit and view:layouts/partials/components/botones/acepcion/*. It extends Controller, calls envioAcepcion_helper, global_helper and mstEntradaValor_helper, renders diccionario/aula/acepcionEdit, and writes model:EnvioAcepcion."}, {"id": "EnviosController", "name": "EnviosController", "kind": "module", "language": "php", "loc": 479, "file": "legacy/lexican/app/Http/Controllers/EnviosController.php", "description": "EnviosController handles sending a student's diccionario personal to diccionarios de aula. enviarDiccionarioGET lists the user's classroom dictionaries (activo, inactivo, planificado) and renders dpDiccionarioEnviarFormulario. enviarDiccionarioPOST hides or shows the selected entries, then calls dpEnvio_EnviarEntradasADicAula for the first target dictionary. It is dispatched by routes/web and several views. It extends Controller, calls dicAula_helper, dpDiccionarios_helper, dpEntradas_helper, dpEnvios_helper and global_helper, and reads DicAula, DiccionarioPersonalEntrada and EnvioEntrada."}, {"id": "dpEnvios_helper", "name": "dpEnvios_helper", "kind": "module", "language": "php", "loc": 628, "file": "legacy/lexican/app/Helpers/dpEnvios_helper.php", "description": "dpEnvios_helper is a 628-line helper module that submits a student's diccionario personal, either whole or as selected entries, to one or more diccionarios de aula. It creates one Envio per DicAula inside a database transaction, sends only visible entries and records any error for each attempt. It is called by DicAulaController, EnviosController and dpEntradas_helper. It calls dicAula_helper, dpAcepciones_helper, dpDiccionarios_helper, dpEntradas_helper, dpMedios_helper and global_helper. It reads CampoEntrada, DicAula and DiccionarioPersonalEntrada, and writes Envio, EnvioAcepcion, EnvioAcepcionMedio, EnvioAcepcionTematica and EnvioEntrada."}, {"id": "envioAcepcion_helper", "name": "envioAcepcion_helper", "kind": "module", "language": "php", "loc": 142, "file": "legacy/lexican/app/Helpers/envioAcepcion_helper.php", "description": "envioAcepcion_helper is a module of helper functions for editing a submitted acepci\u00f3n in the diccionario de aula. It replaces the tem\u00e1ticas linked to the sense and swaps its image, audio or video media, deleting the previous file of the same type and generating thumbnails for images and videos. It is called by EnvioAcepcionController, calls create-thumbnail, dpMedios_helper, global_helper and video_thumbnail, reads model:EnvioAcepcion, and writes model:EnvioAcepcionMedio and model:EnvioAcepcionTematica."}]}, {"id": "dom:comentarios", "name": "Comentarios", "kind": "domain", "children": [{"id": "ComentariosController", "name": "ComentariosController", "kind": "module", "language": "php", "loc": 329, "file": "legacy/lexican/app/Http/Controllers/ComentariosController.php", "description": "ComentariosController handles comments on a student's diccionario personal entries and on the diccionario de aula. It shows every comment across the user's connected classroom dictionaries (comentariosDiccionarioGET) and returns comment modals through Ajax (getComentariosEntradaAjax, getComentariosDiccionarioAjax). Requests reach it from routes/web and from views such as comentarios/comentariosDiccionarioEnviar and diccionario/aula. It calls ComentariosHelper, dicAula_helper, dpDiccionarios_helper, dpEntradas_helper and global_helper, and renders comentarios/comentariosDiccionarioVer. It reads DicAula and EnvioEntrada and writes ComentarioGeneral."}, {"id": "ComentariosHelper", "name": "ComentariosHelper", "kind": "module", "language": "php", "loc": 416, "file": "legacy/lexican/app/Helpers/ComentariosHelper.php", "description": "ComentariosHelper is a 416-line module of global helper functions that gathers comments on classroom dictionaries: it lists the connected user's DicAula records, marks each activo or inactivo depending on whether visible entry or general comments exist, and filters comments by the comentarios_visibles setting, newest fecha_envio first. It calls dicAula_helper, reads ComentarioEntrada, DicAula and DiccionarioPersonal, and writes ComentarioGeneral. It is called by ComentariosController, the comentarios/comentariosDiccionarioEnviar view, and views under layouts/partials/components."}, {"id": "Policies/ComentarioGeneralPolicy", "name": "ComentarioGeneralPolicy", "kind": "module", "language": "php", "loc": 23, "file": "legacy/lexican/app/Policies/ComentarioGeneralPolicy.php"}]}, {"id": "dom:export", "name": "PDF / CSV / Mail", "kind": "domain", "children": [{"id": "CSVController", "name": "CSVController", "kind": "module", "language": "php", "loc": 123, "file": "legacy/lexican/app/Http/Controllers/CSVController.php"}, {"id": "MailController", "name": "MailController", "kind": "module", "language": "php", "loc": 85, "file": "legacy/lexican/app/Http/Controllers/MailController.php"}, {"id": "PDFController", "name": "PDFController", "kind": "module", "language": "php", "loc": 174, "file": "legacy/lexican/app/Http/Controllers/PDFController.php", "description": "PDFController builds PDF exports of a student's diccionario personal and of a diccionario de aula with DOMPDF. Before the diccionario de aula export it checks esParticipante, and it shows export options. When exportOnlyTagged is set without listaTematicas, it redirects back with an error. It is dispatched by routes/web and views diccionario/aula, diccionario/personal, layouts/partials/components/* and layouts/partials/pdf/*. It calls Controller, dpDiccionarios_helper, dpEntradas_helper, global_helper, mstEntradaValor_helper, pdf_helper, diccionario/daOptionsPDF, diccionario/dpOptionsPDFView and layouts/partials/pdf/*, and reads model:DicAula."}, {"id": "mail_helper", "name": "mail_helper", "kind": "module", "language": "php", "loc": 49, "file": "legacy/lexican/app/Helpers/mail_helper.php"}, {"id": "pdf_helper", "name": "pdf_helper", "kind": "module", "language": "php", "loc": 273, "file": "legacy/lexican/app/Helpers/pdf_helper.php", "description": "pdf_helper is a module that gathers dictionary content into a data array: getDataByDiccionarioPersonalId collects the title, the owner's full name and the entries with their acepciones from a student's diccionario personal, optionally keeping hidden ones or filtering by tematica_id; getDataByDiccionarioAulaId does the same for a diccionario de aula and its profesor. It is called by PDFController, calls daMedios_helper, dicAula_helper, dpMedios_helper and global_helper, and reads DicAula, DiccionarioPersonal, DiccionarioPersonalAcepcionMedio, DiccionarioPersonalAcepcionTematica, EnvioAcepcion, EnvioAcepcionMedio, EnvioAcepcionTematica and EnvioEntrada."}]}, {"id": "dom:admin", "name": "Admin (Voyager)", "kind": "domain", "children": [{"id": "Voyager/VoyagerAuthController", "name": "VoyagerAuthController", "kind": "module", "language": "php", "loc": 64, "file": "legacy/lexican/app/Http/Controllers/Voyager/VoyagerAuthController.php"}, {"id": "Voyager/VoyagerBaseController", "name": "VoyagerBaseController", "kind": "module", "language": "php", "loc": 152, "file": "legacy/lexican/app/Http/Controllers/Voyager/VoyagerBaseController.php", "description": "VoyagerBaseController extends the Voyager BREAD controller to customise browse listings. Its index method finds the DataType by slug, queries the model (or DB::table when no model exists), applies key0/value0/filter0 search filters ('equals' or LIKE), ordering, server_side pagination and withTrashed for SoftDeletes, then builds actions and showCheckboxColumn. The browse permission check is commented out. It is dispatched by routes/web and calls voyager_helper. The excerpt shows only index, so other methods are unknown."}, {"id": "Voyager/VoyagerBreadController", "name": "VoyagerBreadController", "kind": "module", "language": "php", "loc": 16, "file": "legacy/lexican/app/Http/Controllers/Voyager/VoyagerBreadController.php"}, {"id": "Voyager/VoyagerCompassController", "name": "VoyagerCompassController", "kind": "module", "language": "php", "loc": 598, "file": "legacy/lexican/app/Http/Controllers/Voyager/VoyagerCompassController.php", "description": "VoyagerCompassController extends BaseVoyagerCompassController with a log viewer gated by browse_compass that can view, download or delete log files. It also adds admin statistics on classroom dictionaries: dic_aula counts per ano_ini_curso_escolar, active ones (estado 1, vigencia \u003e 0), and participants per rol_diccionario_id. routes/web dispatches to it, and CSVController, Voyager/vDicAulaController, Voyager/vDicPersonalController and Voyager/vCentrosA\u00f1oEscolarController call it. It calls dicAula_helper and global_helper, reads centros, dic_aula, dic_aula_participantes, dic_personal, dp_entradas, envios_entradas and DicAulaAtemporal, and writes DicAula. The excerpt covers only part of the 598 lines, so the DicAula write does not appear in it."}, {"id": "Voyager/VoyagerController", "name": "VoyagerController", "kind": "module", "language": "php", "loc": 19, "file": "legacy/lexican/app/Http/Controllers/Voyager/VoyagerController.php"}, {"id": "Voyager/VoyagerDatabaseController", "name": "VoyagerDatabaseController", "kind": "module", "language": "php", "loc": 16, "file": "legacy/lexican/app/Http/Controllers/Voyager/VoyagerDatabaseController.php"}, {"id": "Voyager/VoyagerMediaController", "name": "VoyagerMediaController", "kind": "module", "language": "php", "loc": 16, "file": "legacy/lexican/app/Http/Controllers/Voyager/VoyagerMediaController.php"}, {"id": "Voyager/VoyagerMenuController", "name": "VoyagerMenuController", "kind": "module", "language": "php", "loc": 16, "file": "legacy/lexican/app/Http/Controllers/Voyager/VoyagerMenuController.php"}, {"id": "Voyager/VoyagerRoleController", "name": "VoyagerRoleController", "kind": "module", "language": "php", "loc": 16, "file": "legacy/lexican/app/Http/Controllers/Voyager/VoyagerRoleController.php"}, {"id": "Voyager/VoyagerSettingsController", "name": "VoyagerSettingsController", "kind": "module", "language": "php", "loc": 16, "file": "legacy/lexican/app/Http/Controllers/Voyager/VoyagerSettingsController.php"}, {"id": "Voyager/VoyagerUserController", "name": "VoyagerUserController", "kind": "module", "language": "php", "loc": 16, "file": "legacy/lexican/app/Http/Controllers/Voyager/VoyagerUserController.php"}, {"id": "Voyager/vCentrosA\u00f1oEscolarController", "name": "vCentrosA\u00f1oEscolarController", "kind": "module", "language": "php", "loc": 17, "file": "legacy/lexican/app/Http/Controllers/Voyager/vCentrosAn\u0303oEscolarController.php"}, {"id": "Voyager/vDicAulaController", "name": "vDicAulaController", "kind": "module", "language": "php", "loc": 17, "file": "legacy/lexican/app/Http/Controllers/Voyager/vDicAulaController.php"}, {"id": "Voyager/vDicPersonalController", "name": "vDicPersonalController", "kind": "module", "language": "php", "loc": 17, "file": "legacy/lexican/app/Http/Controllers/Voyager/vDicPersonalController.php"}, {"id": "Voyager/vRecordingController", "name": "vRecordingController", "kind": "module", "language": "php", "loc": 55, "file": "legacy/lexican/app/Http/Controllers/Voyager/vRecordingController.php"}]}, {"id": "dom:shared", "name": "Shared / platform", "kind": "domain", "children": [{"id": "Controller", "name": "Controller", "kind": "module", "language": "php", "loc": 19, "file": "legacy/lexican/app/Http/Controllers/Controller.php"}, {"id": "HealthCheckController", "name": "HealthCheckController", "kind": "module", "language": "php", "loc": 42, "file": "legacy/lexican/app/Http/Controllers/HealthCheckController.php"}, {"id": "HomeController", "name": "HomeController", "kind": "module", "language": "php", "loc": 200, "file": "legacy/lexican/app/Http/Controllers/HomeController.php", "description": "HomeController is the controller behind the home page, and every request must pass the auth middleware. index renders view:home. upload stores images sent from tinyMCE and returns their location as json. logs and downloadLogs list and serve log files. createAdmin creates or updates an admin User with a hardcoded password. test holds sample CheckUsuarioAutorizadoResponse data. Both routes/web and view:diccionario/cookies dispatch to it. It extends Controller, calls global_helper and view:home, and writes User and ds:ext:file-storage."}, {"id": "MediaTypeController", "name": "MediaTypeController", "kind": "module", "language": "php", "loc": 15, "file": "legacy/lexican/app/Http/Controllers/MediaTypeController.php"}, {"id": "ModalAjaxController", "name": "ModalAjaxController", "kind": "module", "language": "php", "loc": 47, "file": "legacy/lexican/app/Http/Controllers/ModalAjaxController.php"}, {"id": "User", "name": "User", "kind": "module", "language": "php", "loc": 68, "file": "legacy/lexican/app/User.php"}, {"id": "create-thumbnail", "name": "create-thumbnail", "kind": "module", "language": "php", "loc": 129, "file": "legacy/lexican/app/Helpers/create-thumbnail.php"}, {"id": "global_helper", "name": "global_helper", "kind": "module", "language": "php", "loc": 1218, "file": "legacy/lexican/app/Helpers/global_helper.php", "description": "global_helper (1218 lines) is a shared library of utility functions. The excerpt shows two of them: valida_nif_nie, which checks whether a NIF or NIE document number is valid, and getHttpMessage, which turns an http status code into its text message. It writes to User, model:Persona, model:UserPersona, model:Centro and ds:ext:file-storage, and reads ds:ext:cauce-ws and model:NivelEstudio. That suggests it sets up user records, but the excerpt does not confirm this. It calls Cas/Helper and view:errors/403 and dispatches Cas/CasManag "view:comentarios/comentariosDiccionarioEnviar", "name": "comentarios/comentariosDiccionarioEnviar", "kind": "screen", "language": "blade", "loc": 275, "file": "legacy/lexican/resources/views/comentarios/comentariosDiccionarioEnviar.blade.php", "description": "The comentarios/comentariosDiccionarioEnviar screen lets a teacher write general comments on a classroom dictionary (dicAula). It lists participantes in an estudiante selector, provides a tinyComentario text editor and posts the form to the comentarios.save route. It also shows saved comments taken from daGetComentariosGeneralesProfesorByDicAula. It extends view:diccionario/home and includes view:layouts/partials/components/*. ComentariosController calls it. It calls ComentariosHelper and global_helper, and dispatches to ComentariosController and DicAulaController."}, {"id": "view:comentarios/comentariosDiccionarioVer", "name": "comentarios/comentariosDiccionarioVer", "kind": "screen", "language": "blade", "loc": 325, "file": "legacy/lexican/resources/views/comentarios/comentariosDiccionarioVer.blade.php", "description": "This screen, comentarios/comentariosDiccionarioVer, shows a student the teacher comments on their dictionary. It lists the diccionarios de aula they have joined and highlights the ones whose comments are visible. It also displays comentariosGenerales, with buttons to sort them by date or alphabetically. ComentariosController calls it. It extends view:diccionario/home, includes view:layouts/partials/components/*, calls global_helper, and holds a POST form to diccionario.send that dispatches to EnviosController. The excerpt covers only the first ~150 lines."}, {"id": "view:development/unirsediccionario", "name": "development/unirsediccionario", "kind": "screen", "language": "blade", "loc": 81, "file": "legacy/lexican/resources/views/development/unirsediccionario.blade.php"}, {"id": "view:diccionario/aula", "name": "diccionario/aula", "kind": "screen", "language": "blade", "loc": 209, "file": "legacy/lexican/resources/views/diccionario/aula.blade.php", "description": "The diccionario/aula screen shows the Diccionario de Aula: an alphabet selector, search box and entry count for the active classroom dictionary. Other users see these tools only when a dictionary is active. Users allowed createDicAula also get buttons for \"Crear diccionario de aula\" and \"Gestionar Entradas Enviadas\", which link to viewing and publishing entradas and to Comentarios generales. DicAulaController calls this screen. It extends view:diccionario/home, calls dicAula_helper, view:layouts/partials/components/* and view:layouts/partials/nentradas, and dispatches to ComentariosController, DicAulaController and PDFController."}, {"id": "view:diccionario/aula/acepcionEdit", "name": "diccionario/aula/acepcionEdit", "kind": "screen", "language": "blade", "loc": 375, "file": "legacy/lexican/resources/views/diccionario/aula/acepcionEdit.blade.php", "description": "This screen (\"Docente - Editar Acepci\u00f3n\") lets a teacher edit a sense of a classroom dictionary entry. It is guarded by createDicAula, posts the form to aula.acepcion.update, and handles image and audio uploads, with a confirmed delete through aula.medio.delete. EnvioAcepcionController renders it. It extends view:diccionario/home, includes view:layouts/partials/dpAcepcion/* and view:layouts/partials/components/*, calls daMedios_helper and global_helper, and dispatches to DicAulaController and EnvioAcepcionController."}, {"id": "view:diccionario/aula/consulta", "name": "diccionario/aula/consulta", "kind": "screen", "language": "blade", "loc": 128, "file": "legacy/lexican/resources/views/diccionario/aula/consulta.blade.php"}, {"id": "view:diccionario/aula/daEntradaEdit", "name": "diccionario/aula/daEntradaEdit", "kind": "screen", "language": "blade", "loc": 104, "file": "legacy/lexican/resources/views/diccionario/aula/daEntradaEdit.blade.php"}, {"id": "view:diccionario/aula/entrada", "name": "diccionario/aula/entrada", "kind": "screen", "language": "blade", "loc": 67, "file": "legacy/lexican/resources/views/diccionario/aula/entrada.blade.php"}, {"id": "view:diccionario/aula/pautas", "name": "diccionario/aula/pautas", "kind": "screen", "language": "blade", "loc": 30, "file": "legacy/lexican/resources/views/diccionario/aula/pautas.blade.php"}, {"id": "view:diccionario/consulta", "name": "diccionario/consulta", "kind": "screen", "language": "blade", "loc": 121, "file": "legacy/lexican/resources/views/diccionario/consulta.blade.php"}, {"id": "view:diccionario/consultaAjax", "name": "diccionario/consultaAjax", "kind": "screen", "language": "blade", "loc": 10, "file": "legacy/lexican/resources/views/diccionario/consultaAjax.blade.php"}, {"id": "view:diccionario/consultaAulaAjax", "name": "diccionario/consultaAulaAjax", "kind": "screen", "language": "blade", "loc": 8, "file": "legacy/lexican/resources/views/diccionario/consultaAulaAjax.blade.php"}, {"id": "view:diccionario/cookies", "name": "diccionario/cookies", "kind": "screen", "language": "blade", "loc": 22, "file": "legacy/lexican/resources/views/diccionario/cookies.blade.php"}, {"id": "view:diccionario/crearDicAula", "name": "diccionario/crearDicAula", "kind": "screen", "language": "blade", "loc": 793, "file": "legacy/lexican/resources/views/diccionario/crearDicAula.blade.php", "description": "The diccionario/crearDicAula screen (793 lines) shows the form a teacher uses to create or modify a classroom dictionary (Diccionario de Aula). It shows the owner from getSessionPersona() and the cursoEscolar. It collects nombreDiccionario, descripcionDiccionario, estudio, grupoLetra, areaMateria and vigencia, which is capped by vigenciaMax. The form posts to 'edit' or 'create'. DicAulaController calls this screen. It extends diccionario.home and calls global_helper, view:diccionario/participantesAjax and view:layouts/partials/components/*. The excerpt covers only the first ~150 lines, so the rest of the screen is not confirmed."}, {"id": "view:diccionario/daOptionsPDF", "name": "diccionario/daOptionsPDF", "kind": "screen", "language": "blade", "loc": 151, "file": "legacy/lexican/resources/views/diccionario/daOptionsPDF.blade.php", "description": "The diccionario/daOptionsPDF screen shows the options form for exporting a dictionary to PDF, with diccionario.exportarpdf__titulo as its title. The user can tick exportOnlyTagged to show the tematicas panel. They can then move tematicas between tematicas_disponibles and tematicas_seleccionadas, which fills the listaTematicas field. In the CONNECTIONS list, PDFController calls this screen. The screen calls view:diccionario/home, the layout it extends, and view:layouts/partials/aulaOptionsPDFform, the form it includes. The packet does not show where the form submits."}, {"id": "view:diccionario/dpDiccionario/dpDiccionarioEnviarFormulario", "name": "diccionario/dpDiccionario/dpDiccionarioEnviarFormulario", "kind": "screen", "language": "blade", "loc": 505, "file": "legacy/lexican/resources/views/diccionario/dpDiccionario/dpDiccionarioEnviarFormulario.blade.php", "description": "This 505-line screen is the form for submitting a student's personal dictionary (diccionario personal) to one or more classroom dictionaries (diccionarios de aula). It shows the classroom dictionaries the user has joined and a cloud of the dictionary's entries, marked visible or hidden. It also shows the date of the last submission (env\u00edo) to each classroom dictionary. It extends view:diccionario/home, includes view:layouts/partials/components/*, calls global_helper, and is rendered by EnviosController. It dispatches to EnviosController and DiccionarioPersonalController."}, {"id": "view:diccionario/dpDiccionario/dpModificacion", "name": "diccionario/dpDiccionario/dpModificacion", "kind": "screen", "language": "blade", "loc": 113, "file": "legacy/lexican/resources/views/diccionario/dpDiccionario/dpModificacion.blade.php"}, {"id": "view:diccionario/dpEntrada/listado", "name": "diccionario/dpEntrada/listado", "kind": "screen", "language": "blade", "loc": 45, "file": "legacy/lexican/resources/views/diccionario/dpEntrada/listado.blade.php"}, {"id": "view:diccionario/dpEntrada/masterEntrada", "name": "diccionario/dpEntrada/masterEntrada", "kind": "screen", "language": "blade", "loc": 118, "file": "legacy/lexican/resources/views/diccionario/dpEntrada/masterEntrada.blade.php"}, {"id": "view:diccionario/dpOptionsPDFView", "name": "diccionario/dpOptionsPDFView", "kind": "screen", "language": "blade", "loc": 151, "file": "legacy/lexican/resources/views/diccionario/dpOptionsPDFView.blade.php", "description": "The diccionario/dpOptionsPDFView screen appears to be the page where a user chooses options before exporting the dictionary to PDF, titled via diccionario.exportarpdf__titulo. It extends view:diccionario/home and includes view:layouts/partials/dpOptionsPDFform. Its scripts show the tematicas list only when exportOnlyTagged is checked. They also move tem\u00e1ticas between tematicas_disponibles and tematicas_seleccionadas and record the choices in listaTematicas. It is not an entry point, and PDFController calls it. A TODO notes the script was copied from acepcionEdit.blade.php."}, {"id": "view:diccionario/entradasAula", "name": "diccionario/entradasAula", "kind": "screen", "language": "blade", "loc": 204, "file": "legacy/lexican/resources/views/diccionario/entradasAula.blade.php", "description": "The diccionario/entradasAula screen shows the entries ($entradas) submitted to the active classroom dictionary, titled from getDicAulaActivo(), so they can be viewed and published. When there are no entries, it shows an info alert. A search form posts back to the current page and filters by buscarNombre, estado (publicado or enviado), estudiante (taken from the dicAula participantes), and desde/hasta submission dates. A swiper-container shows participant avatars. DicAulaController calls this screen. It extends view:diccionario/home and calls dicAula_helper and view:layouts/partials/components/*."}, {"id": "view:diccionario/home", "name": "diccionario/home", "kind": "screen", "language": "blade", "loc": 164, "file": "legacy/lexican/resources/views/diccionario/home.blade.php", "description": "diccionario/home is the dictionary screen template that other views build on. It shows the user's avatar and builds the navigation. When the Aula tab is active, the navigation lists the classroom dictionaries the person has joined and marks the ones not visible to students. Otherwise it links to the personal dictionary. It calls view:layouts/app, dicAula_helper, global_helper and view:layouts/partials/components/*. It dispatches to DicAulaController and DiccionarioPersonalController, and many views call it, including view:diccionario/personal, view:diccionario/aula and view:errors/404."}, {"id": "view:diccionario/participantesAjax", "name": "diccionario/participantesAjax", "kind": "screen", "language": "blade", "loc": 73, "file": "legacy/lexican/resources/views/diccionario/participantesAjax.blade.php"}, {"id": "view:diccionario/personal", "name": "diccionario/personal", "kind": "screen", "language": "blade", "loc": 227, "file": "legacy/lexican/resources/views/diccionario/personal.blade.php", "description": "The diccionario/personal screen shows a student's Diccionario Personal. It extends diccionario/home and offers an alphabet selector routed to personal.consulta.byInitial, a search box, and an entry count through view:layouts/partials/nentradas. Its action buttons let the student add an entrada (entrada.buscador) or open submission (env\u00edo) and comment options, such as joining a dictionary. It is called by DiccionarioPersonalController. It includes view:layouts/partials/components/* and view:layouts/partials/components/botones/diccionario/*, and dispatches to DiccionarioPersonalController and PDFController. A commented-out debug block remains."}, {"id": "view:errors/403", "name": "errors/403", "kind": "screen", "language": "blade", entariosDiccionarioAjax, and haciendoLlamada blocks repeated clicks while a request is running. It is called by diccionario/home, diccionario/personal and layouts/partials/components/*, and dispatches to ComentariosController and EnviosController."}, {"id": "view:layouts/partials/components/botones/entrada/*", "name": "components/botones/entrada/*", "kind": "screen", "language": "blade", "loc": 310, "file": "legacy/lexican/resources/views/layouts/partials/components/botones/entrada", "description": "This screen node, components/botones/entrada/*, provides the action buttons shown for each entrada: comentar, edit, delete, get, ocultar, enviar, and eliminarAula. eliminarAula removes an env\u00edo from the classroom dictionary only when its estado is not publicado. DicAulaController, dicAula_helper, view:layouts/partials/components/* and view:layouts/partials/consulta/* call this node. It calls ComentariosHelper, dicAula_helper and view:layouts/partials/components/*. It also dispatches to ComentariosController, DicAulaController, DiccionarioPersonalController and EnviosController."}, {"id": "view:layouts/partials/consulta/*", "name": "consulta/*", "kind": "screen", "language": "blade", "loc": 787, "file": "legacy/lexican/resources/views/layouts/partials/consulta", "description": "consulta/* is a group of Blade partials, 787 lines in total, used on lookup screens to show a dictionary acepci\u00f3n. It renders the sense's orden, definicion, frase_ejemplo, ejemplo2, language word and tematicas, plus audio, video and image icons. A separate acepcionAula set handles classroom-dictionary senses and only shows media when the dicAulaCampos visibility setting is visible. The partials call daMedios_helper, dpMedios_helper, global_helper and the alerts/*, components/* and botones partials, and they dispatch to DicAulaController and DiccionarioPersonalController. They are called by DicAulaController, view:diccionario/consulta, view:diccionario/consultaAjax, view:diccionario/consul     if (!visible(n, k, tx, ty, vw, vh)) continue;
    const sx = n.x * k + tx, sy = n.y * k + ty;
    const inFlow = flowSet ? flowSet.has(n.id) : true;
    const isSel = selected === n.id, isHov = hovered === n.id;

    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.globalAlpha = (n.container ? 0.55 : 0.85) * (inFlow ? 1 : 0.18);
    ctx.fillStyle = isSel ? "rgba(204,120,92,0.25)" : fillFor(n);
    ctx.fill(); ctx.globalAlpha = 1;
    ctx.lineWidth = isSel ? 2.5 : isHov ? 1.8 : n.container ? 1 : 0.8;
    ctx.strokeStyle = isSel || isHov ? "#cc785c"
      : entrySet.has(n.id) ? "rgba(204,120,92,0.9)"
      : n.container ? "#3a3a3a" : "rgba(212,212,212,0.18)";
    if (entrySet.has(n.id) && !isSel && !isHov) ctx.lineWidth = 1.6;
    if (deadSet.has(n.id)) ctx.setLineDash([5, 4]); // dead-end candidate
    ctx.globalAlpha = inFlow ? 1 : 0.25; ctx.stroke(); ctx.globalAlpha = 1;
    ctx.setLineDash([]);

    if (sr > LABEL_R) {
      const fs = Math.min(17, Math.max(9, sr / 6));
      ctx.font = `${n.container ? "600" : "400"} ${fs}px system-ui, sans-serif`;
      ctx.fillStyle = n.container ? "#8a8a8a" : "#e8e8e8";
      ctx.globalAlpha = inFlow ? 1 : 0.3;
      const ly = n.container && sr > 55 ? sy - sr + fs + 5 : sy;
      const label = n.name.length > 28 ? [...n.name].slice(0, 26).join("") + "…" : n.name;
      ctx.fillText(label, sx, ly);
      ctx.globalAlpha = 1;
    }
  }

  // Edges: batched per kind, endpoints must both be on screen
  const vis = id => { const n = byId.get(id); return n && n.r * k > MIN_R * 2 && isRevealed(n, k) && visible(n, k, tx, ty, vw, vh); };
  const curve = (a, b) => {
    const ax = a.x * k + tx, ay = a.y * k + ty, bx = b.x * k + tx, by = b.y * k + ty;
    if ((ax - bx) ** 2 + (ay - by) ** 2 < 120) return;
    ctx.moveTo(ax, ay);
    ctx.quadraticCurveTo((ax + bx) / 2 + (by - ay) * 0.12, (ay + by) / 2 + (ax - bx) * 0.12, bx, by);
  };
  if (!flowSet) {
    for (const [kind, style] of Object.entries(EDGE_STYLE)) {
      if (!kindOn[kind]) continue;
      const bucket = edgesByKind.get(kind);
      if (!bucket) continue;
      ctx.strokeStyle = style.color; ctx.lineWidth = 0.8; ctx.beginPath();
      let drawn = 0;
      for (const e of bucket) {
        if (!vis(e.source) || !vis(e.target)) continue;
        curve(byId.get(e.source), byId.get(e.target));
        if (++drawn > 1200) break;
      }
      ctx.stroke();
    }
  }

  // Focus edges (hover/selection) in accent, on top
  const focus = hovered || selected;
  if (focus && !flowSet) {
    ctx.strokeStyle = "#cc785c"; ctx.lineWidth = 1.5; ctx.beginPath();
    for (const e of adjacency.get(focus) || []) {
      const a = byId.get(e.source), b = byId.get(e.target);
      if (a && b) curve(a, b);
    }
    ctx.stroke();
  }

  // Active flow: numbered step path
  if (flowSet) {
    ctx.strokeStyle = "#cc785c"; ctx.lineWidth = 2;
    const seq = activeFlow._seq;
    ctx.beginPath();
    for (let i = 0; i + 1 < seq.length; i++) {
      const a = byId.get(seq[i]), b = byId.get(seq[i + 1]);
      if (a && b) curve(a, b);
    }
    ctx.stroke();
    seq.forEach((id, i) => {
      const n = byId.get(id); if (!n) return;
      const sx = n.x * k + tx, sy = n.y * k + ty - n.r * k - 10;
      ctx.beginPath(); ctx.arc(sx, sy, 9, 0, Math.PI * 2);
      ctx.fillStyle = "#cc785c"; ctx.fill();
      ctx.fillStyle = "#1e1e1e"; ctx.font = "700 11px system-ui, sans-serif";
      ctx.fillText(String(i + 1), sx, sy + 0.5);
    });
  }
}

// ── Zoom / pan / hit-testing ────────────────────────────────────────────
// Max zoom scales with the smallest leaf so deep estates stay reachable.
const leafRs = nodes.filter(n => !n.container).map(n => n.r);
const MAX_K = Math.max(600, Math.ceil(140 / Math.max(1e-6, Math.min(...leafRs))));
const zoomB = d3.zoom().scaleExtent([0.05, MAX_K]).clickDistance(4)
  .on("zoom", ev => { transform = ev.transform; requestDraw(); })
  .on("start", () => canvas.classList.add("dragging"))
  .on("end", () => canvas.classList.remove("dragging"));
const sel = d3.select(canvas).call(zoomB).on("dblclick.zoom", null);

function hit(mx, my) {
  const wx = (mx - transform.x) / transform.k, wy = (my - transform.y) / transform.k;
  let best = null;
  for (const n of nodes) {
    if (n.r * transform.k < MIN_R) continue;
    // Mirror the draw-time LOD rule so hidden nodes can't be clicked.
    if (!isRevealed(n, transform.k)) continue;
    const dx = wx - n.x, dy = wy - n.y;
    if (dx * dx + dy * dy <= n.r * n.r && (!best || n.r < best.r)) best = n;
  }
  return best;
}
let flyGen = 0;
function flyTo(n) {
  const gen = ++flyGen; // a newer flyTo (or Escape) cancels this one
  const vw = innerWidth, vh = innerHeight, cur = transform;
  const from = [(vw / 2 - cur.x) / cur.k, (vh / 2 - cur.y) / cur.k, Math.min(vw, vh) / cur.k];
  const targetW = Math.max(n.r * 2.6, Math.min(vw, vh) / MAX_K); // respect scaleExtent
  const interp = d3.interpolateZoom(from, [n.x, n.y, targetW]);
  const dur = Math.max(400, interp.duration * 0.55), t0 = performance.now();
  (function step() {
    if (gen !== flyGen) return;
    const t = Math.min(1, (performance.now() - t0) / dur);
    const [cx, cy, w] = interp(d3.easeCubicInOut(t));
    const k = Math.min(vw, vh) / w;
    sel.call(zoomB.transform, d3.zoomIdentity.translate(vw / 2 - cx * k, vh / 2 - cy * k).scale(k));
    if (t < 1) requestAnimationFrame(step);
  })();
}
canvas.addEventListener("mousemove", e => {
  const h = hit(e.offsetX, e.offsetY);
  const id = h ? h.id : null;
  if (id !== hovered) { hovered = id; canvas.style.cursor = h ? "pointer" : "grab"; requestDraw(); }
});
canvas.addEventListener("click", e => {
  const h = hit(e.offsetX, e.offsetY);
  if (activeFlow && h) setFlow(""); // leave the walkthrough to inspect a node
  selected = h ? h.id : null;
  resultsEl.innerHTML = "";
  renderSidebar(); requestDraw();
});
canvas.addEventListener("dblclick", e => { const h = hit(e.offsetX, e.offsetY); if (h) flyTo(h); });
addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  // Escape inside the search box or flow select should only affect that
  // control, not reset the whole viewport.
  if (e.target === searchEl || (e.target && e.target.tagName === "SELECT")) return;
  flyGen++; selected = null; resultsEl.innerHTML = "";
  setFlow(""); flyTo(nodes[0]); renderSidebar();
});
addEventListener("resize", requestDraw);

// ── Sidebar ─────────────────────────────────────────────────────────────
const sidebar = document.getElementById("sidebar");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function renderSidebar() {
  if (activeFlow) return renderFlowSidebar();
  if (!selected) { sidebar.classList.remove("open"); return; }
  const n = byId.get(selected);
  const neighbors = [];
  for (const e of edges) {
    if (e.source === n.id) neighbors.push({ id: e.target, rel: EDGE_STYLE[e.kind]?.label || e.kind, dir: "→" });
    else if (e.target === n.id) neighbors.push({ id: e.source, rel: EDGE_STYLE[e.kind]?.label || e.kind, dir: "←" });
  }
  sidebar.innerHTML = `
    <span class="closebtn" id="close">×</span>
    <h2>${esc(n.name)}</h2>
    <div class="meta">${esc(n.kind)}${n.language ? " · " + esc(n.language) : ""}${n.loc ? " · " + n.loc.toLocaleString() + " LOC" : ""}</div>${n.description ? `<p class="desc">${esc(n.description)}<span class="cap">written by Claude from a source excerpt and the node's connections</span></p>` : ""}
    <div>${entrySet.has(n.id) ? '<span class="badge entry">entry point</span>' : ""}
      ${deadSet.has(n.id) ? '<span class="badge">dead-end candidate</span>' : ""}
      <span class="badge">fan-in ${fanIn.get(n.id) || 0}</span>
      <span class="badge">fan-out ${fanOut.get(n.id) || 0}</span></div>
    ${n.file ? `<h3>Source</h3><div class="meta">${esc(n.file)}</div>` : ""}
    ${neighbors.length ? `<h3>Connections (${neighbors.length})</h3>` +
      neighbors.slice(0, 40).map(x => `<span class="link" data-id="${esc(x.id)}">${x.dir} ${esc(byId.get(x.id)?.name || x.id)} <span class="kind">${esc(x.rel)}</span></span>`).join("") +
      (neighbors.length > 40 ? `<div class="meta">…and ${neighbors.length - 40} more</div>` : "") : ""}`;
  sidebar.classList.add("open");
  sidebar.querySelector("#close").onclick = () => { selected = null; renderSidebar(); requestDraw(); };
  sidebar.querySelectorAll(".link").forEach(el => el.onclick = () => {
    const t = byId.get(el.dataset.id);
    if (t) { selected = t.id; flyTo(t); renderSidebar(); requestDraw(); }
  });
}
function renderFlowSidebar() {
  const f = activeFlow;
  sidebar.innerHTML = `
    <span class="closebtn" id="close">×</span>
    <h2>${esc(f.name)}</h2>
    <div class="meta">${f.persona ? "Persona: " + esc(f.persona) : ""}</div>
    ${f.description ? `<p style="font-size:13px">${esc(f.description)}</p>` : ""}
    <h3>Steps</h3>
    <ol>${f.steps.map(s => `<li>${esc(s.label)}${(s.nodes || []).length ?
      `<div class="meta">${s.nodes.map(id => esc(byId.get(id)?.name || id)).join(" → ")}</div>` : ""}</li>`).join("")}</ol>`;
  sidebar.classList.add("open");
  sidebar.querySelector("#close").onclick = () => setFlow("");
}

// ── Search ──────────────────────────────────────────────────────────────
const searchEl = document.getElementById("search"), resultsEl = document.getElementById("results");
searchEl.addEventListener("input", () => {
  const q = searchEl.value.trim().toLowerCase();
  resultsEl.innerHTML = "";
  if (q.length < 2) return;
  nodes.filter(n => n.name.toLowerCase().includes(q)).slice(0, 12).forEach(n => {
    const d = document.createElement("div");
    d.innerHTML = `${esc(n.name)}<span class="kind">${esc(n.kind)}</span>`;
    d.onclick = () => { selected = n.id; resultsEl.innerHTML = ""; flyTo(n); renderSidebar(); requestDraw(); };
    resultsEl.appendChild(d);
  });
});

// ── Edge-kind toggles & legend ──────────────────────────────────────────
const togglesEl = document.getElementById("toggles");
for (const [kind, style] of Object.entries(EDGE_STYLE)) {
  if (!edges.some(e => e.kind === kind)) continue;
  const solid = style.color.replace(/[\d.]+\)$/, "0.9)");
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox" checked><span class="swatch" style="background:${solid}"></span>${style.label}`;
  l.querySelector("input").onchange = ev => { kindOn[kind] = ev.target.checked; requestDraw(); };
  togglesEl.appendChild(l);
}
if (!togglesEl.children.length) togglesEl.style.display = "none";

// ── Flows ───────────────────────────────────────────────────────────────
const flowsPanel = document.getElementById("flows"), flowSel = document.getElementById("flowSel");
const flows = (DATA.flows || []).filter(Boolean).map(f => ({
  ...f,
  steps: (Array.isArray(f.steps) ? f.steps : []).map(s => ({
    label: String(s?.label ?? ""), nodes: (s?.nodes || []).map(String) })),
}));
if (flows.length) {
  flowsPanel.style.display = "";
  flows.forEach((f, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = f.persona ? `${f.name} (${f.persona})` : f.name;
    flowSel.appendChild(o);
  });
  flowSel.onchange = () => setFlow(flowSel.value);
}
function setFlow(v) {
  flowSel.value = v;
  activeFlow = v === "" ? null : flows[+v];
  if (activeFlow && !activeFlow._seq) {
    activeFlow._seq = activeFlow.steps.flatMap(st => st.nodes);
    activeFlow._set = new Set(activeFlow._seq);
  }
  selected = null;
  if (activeFlow) {
    const ids = activeFlow.steps.flatMap(s => s.nodes || []);
    const pts = ids.map(id => byId.get(id)).filter(Boolean);
    if (pts.length) {
      const minX = Math.min(...pts.map(n => n.x - n.r)), maxX = Math.max(...pts.map(n => n.x + n.r));
      const minY = Math.min(...pts.map(n => n.y - n.r)), maxY = Math.max(...pts.map(n => n.y + n.r));
      flyTo({ x: (minX + maxX) / 2, y: (minY + maxY) / 2, r: Math.max(maxX - minX, maxY - minY) / 2 || 100 });
    }
  }
  renderSidebar(); requestDraw();
  if (!activeFlow) sidebar.classList.remove("open");
}

// ── Observations ────────────────────────────────────────────────────────
if ((DATA.observations || []).length) {
  document.getElementById("obs").style.display = "";
  document.getElementById("obsList").innerHTML =
    DATA.observations.map(o => `<li style="margin:4px 0">${esc(o)}</li>`).join("");
}

// ── Boot ────────────────────────────────────────────────────────────────
document.getElementById("title").textContent = DATA.system || DATA.root.name || "System topology";
{
  const leaves = nodes.filter(n => !n.container);
  const stores = leaves.filter(n => n.kind === "datastore").length;
  document.getElementById("stats").textContent =
    `${leaves.length - stores} modules` + (stores ? ` · ${stores} data stores` : "") +
    ` · ${edges.length} edges` + (entrySet.size ? ` · ${entrySet.size} entry points` : "");
}
{
  const vw = innerWidth, vh = innerHeight;
  const k = Math.min(vw, vh) / (WORLD * 1.05);
  sel.call(zoomB.transform, d3.zoomIdentity.translate(vw / 2 - WORLD / 2 * k, vh / 2 - WORLD / 2 * k).scale(k));
}
requestDraw();
</script>
</body>
