# Codecov reports project and patch coverage on every pull request (both must reach 90 %).
# The local and CI blocking gate is `bun run test:coverage` (per-file lines and functions, [test] in bunfig.toml).
coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 1%
    patch:
      default:
        target: 90%
comment:
  layout: "condensed_header, diff, files"
  require_changes: true
