name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC, no secret token
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lexican
          POSTGRES_PASSWORD: lexican
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lexican" --health-interval 5s --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: legacy
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://lexican:lexican@localhost:5432/postgres
      TEST_MARIADB_URL: mysql://root:root@127.0.0.1:3306/legacy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: npm ci
      - run: npm run audit
      - run: npm run licenses
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Unit, contract (PGlite AND PostgreSQL), API integration and MariaDB migration tests; fails under 90 %.
      - run: npm run test:coverage

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
      - run: npm run build
      - run: npm run build:demo
      - run: npm run check:dist

      - run: npx playwright install --with-deps chromium firefox
      # Demo against a Pages-like static server and a local fake CAS; production E2E on Bun + PostgreSQL.
      - run: npm run e2e -- --project=demo-chromium --project=demo-firefox --project=demo-mobile --project=prod-chromium
        env:
          E2E_DATABASE_URL: postgres://lexican:lexican@localhost:5432/postgres

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  webkit:
    # WebKit boots the in-browser PGlite slowly on hosted runners: its own job, one worker, longer timeouts.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run e2e:webkit
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-webkit
          path: playwright-report/
          retention-days: 7

  docker:
    # The production image: builds, refuses to start unconfigured, and serves the local profile (migrate + seed).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t lexican:local .
      - name: Unconfigured image refuses to start (APP_ENV defaults to production)
        run: |
          if docker run --rm -e DATABASE_URL=postgres://x -e PUBLIC_URL=https://lexican.example.test lexican:local; then
            echo "::error::the image started without institutional configuration"; exit 1
          fi
      - name: Local compose profile comes up healthy
        run: |
          docker compose --profile app up -d
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && break; sleep 2; done
          curl -fsS http://localhost:3000/api/health
          test "$(curl -fsS http://localhost:3000/api/auth/providers)" = '{"cas":"test","password":true}'
          curl -fsS -o /dev/null http://localhost:3000/
      - if: always()
        run: docker compose --profile app logs --no-color && docker compose --profile app down -v

  migration:
    # Legacy MariaDB fixture → migrator → PostgreSQL → assertions (§79).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lexican
          POSTGRES_PASSWORD: lexican
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lexican" --health-interval 5s --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: legacy
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://lexican:lexican@localhost:5432/postgres
      TEST_MARIADB_URL: mysql://root:root@127.0.0.1:3306/legacy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: npm ci
      - run: npm run test:migration
