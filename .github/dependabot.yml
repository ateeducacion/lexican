version: 2
updates:
  # bun.lock must stay at lockfileVersion 1: Dependabot's bun ecosystem runs Bun 1.3.x and rejects v2
  # ("Unsupported bun.lock 'lockfileVersion' 2"; dependabot-core#16026, fix pending in #16071). Bun 1.4 keeps an existing
  # v1 lockfile, so the project still runs Bun 1.4.2; `bun run check:lockfile` guards the format in CI (AGENTS.md).
  # Security updates and the dependency graph do not read bun.lock: `bun audit` in CI covers vulnerabilities.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Keep TypeScript on the verified 6.0 minor (docs/adr/0002-stack.md).
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # Bun types follow the pinned Bun runtime (1.4.2 in the image and CI): upgrade them together.
      - dependency-name: '@types/bun'
      # Review Drizzle upgrades together, including RC changes (docs/adr/0003-drizzle-pglite.md).
      - dependency-name: drizzle-orm
        update-types: [version-update:semver-major]
      - dependency-name: drizzle-kit
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
