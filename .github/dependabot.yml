version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8.x supports TypeScript < 6.1 (docs/adr/0002-stack.md).
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # Bun types follow the pinned Bun runtime (1.4.2 in the image and CI): upgrade them together.
      - dependency-name: '@types/bun'
      # Drizzle v1 changes the migration layout; upgrade deliberately (docs/adr/0003-drizzle-pglite.md).
      - dependency-name: drizzle-orm
        update-types: [version-update:semver-major]
      - dependency-name: drizzle-kit
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
